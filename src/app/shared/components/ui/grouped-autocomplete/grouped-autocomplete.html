<div class="autocomplete-wrapper" appClickOutside (clickOutside)="onClickOutside()">
  <label *ngIf="label()" class="block font-medium text-[#395f93] text-sm">
    {{ label() }}
    <span *ngIf="isRequired()" class="text-red-500">*</span>
  </label>

  <div class="relative">
    <div class="relative">
      <input
        [formControl]="searchInput"
        type="text"
        [placeholder]="placeholder()"
        (focus)="onInputFocus()"
        [class]="{
          'border-red-500 focus:ring-red-500': hasError(),
          'border-gray-300 focus:ring-blue-500 focus:border-blue-500': !hasError()
        }"
        class="w-full border border-gray-300 rounded-md p-2 focus:ring-1 outline-none"
      />
      <span
        *ngIf="selectedOption()"
        class="absolute right-3 top-1/2 transform -translate-y-1/2 cursor-pointer text-gray-400 hover:text-gray-600"
        (click)="clearSelection()"
      >
        ✕
      </span>
    </div>

    <!-- Loading Skeleton -->
    <div *ngIf="isLoading()" class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-300 rounded-md shadow-lg z-10 p-2 flex flex-col px-3 py-4 gap-y-4">
      <div class="flex-1">
        <app-skeleton shape="rectangle" size="100%" height="12px" class="mb-6"></app-skeleton>
      </div>
      <div class="flex-1">
        <app-skeleton shape="rectangle" size="100%" height="12px" class="mb-6"></app-skeleton>
      </div>
      <div class="flex-1">
        <app-skeleton shape="rectangle" size="100%" height="12px" class="mb-6"></app-skeleton>
      </div>
    </div>

    <!-- Dropdown Options (grouped, optgroup-style) -->
    <div
      *ngIf="isOpen() && !isLoading() && hasResults()"
      class="absolute top-full z-1000 left-0 right-0 mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-72 overflow-y-auto"
    >
      <ng-container *ngFor="let group of groups(); trackBy: trackByGroupLabel">
        <div *ngIf="group.options.length > 0">
          <div class="sticky top-0 bg-gray-50 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wide text-gray-400 border-b border-gray-200">
            {{ group.groupLabel }}
          </div>
          <div
            *ngFor="let option of group.options; trackBy: trackByOptionId"
            (click)="!group.disabled && selectOption(option)"
            [class.bg-blue-50]="isSelected(option)"
            [class.text-blue-700]="isSelected(option)"
            [class.font-medium]="isSelected(option)"
            [class.opacity-50]="group.disabled"
            [class.cursor-not-allowed]="group.disabled"
            [class.cursor-pointer]="!group.disabled"
            [class.hover:bg-blue-50]="!group.disabled"
            class="px-3 py-2 pl-5 border-b border-gray-100 last:border-b-0 text-sm text-gray-700"
          >
            {{ displayFn()(option) }}
          </div>
        </div>
      </ng-container>
    </div>

    <!-- No Results -->
    <div
      *ngIf="!isLoading() && isOpen() && !hasResults() && (searchInput.value || '').length > 0"
      class="absolute top-full left-0 right-0 mt-1 bg-white border border-gray-300 rounded-md shadow-lg z-10 p-3 text-center text-gray-500 text-sm"
    >
      No se encontraron resultados
    </div>
  </div>

  <small *ngIf="description()" class="text-gray-500 text-xs block mt-1">
    {{ description() }}
  </small>
</div>
