@if (open()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-3 sm:p-4"
    role="dialog"
    aria-modal="true"
    (pointerdown)="onBackdropPointerDown($event)"
    (pointerup)="onBackdropPointerUp($event)"
  >
    <section
      class="w-full overflow-hidden rounded-lg bg-white shadow-xl"
      [class]="sizeClasses()"
    >
      <header class="px-4 py-4 sm:px-5">
        <h2 [id]="titleId" class="text-lg font-semibold text-slate-900">{{ titleM() }}</h2>
        <ng-content select="[modal-title]"></ng-content>
      </header>

      <div class="max-h-[72vh] sm:max-h-[70vh] overflow-auto px-4 py-4 sm:px-5">
        <ng-content></ng-content>
      </div>

      <footer class="flex flex-wrap items-center justify-end gap-2 px-4 py-3 sm:px-5">
        <ng-content select="[modal-actions]"></ng-content>

        @if (showCloseButton()) {
          <button
            type="button"
            class="rounded-md border border-slate-300 bg-slate-100 px-4 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-200"
            (click)="onCloseClick()"
          >
            {{ closeText() }}
          </button>
        }

        @if (showPrimaryButton()) {
          <button
            type="button"
            [disabled]="primaryLoading() || primaryDisabled()"
            [class]="(primaryLoading() || primaryDisabled()) ? 'rounded-md bg-blue-400 cursor-not-allowed px-4 py-2 text-sm font-semibold text-white transition flex items-center gap-2' : 'rounded-md bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-blue-700 flex items-center gap-2'"
            (click)="onPrimaryClick()"
          >
            @if (primaryLoading()) {
              <svg class="animate-spin h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
            }
            {{ primaryText() }}
          </button>
        }
      </footer>
    </section>
  </div>
}
