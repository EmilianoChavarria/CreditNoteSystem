<app-modal
    [open]="open()"
    [titleM]="'FORECAST.EDIT_DISTRIBUTOR.TITLE' | translate"
    size="lg"
    [primaryText]="'FORECAST.EDIT_DISTRIBUTOR.SAVE' | translate"
    [closeText]="'FORECAST.EDIT_DISTRIBUTOR.CANCEL' | translate"
    [primaryLoading]="saving()"
    [primaryDisabled]="saving()"
    [closeOnBackdrop]="true"
    (openChange)="openChange.emit($event)"
    (primaryAction)="onSave()">

    <div class="flex flex-col gap-4">

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_RAZON_SOCIAL' | translate }}</label>
            <input
                type="text"
                [value]="form().businessName ?? ''"
                (input)="patchForm('businessName', $any($event.target).value)"
                placeholder="Distribuidora Ejemplo SA de CV"
                class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition" />
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_RFC' | translate }}</label>
            <input
                type="text"
                [value]="form().taxId ?? ''"
                (input)="patchForm('taxId', $any($event.target).value)"
                placeholder="DIS123456ABC"
                class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition uppercase" />
        </div>

        <!-- DIRECCIÓN -->
        <div class="flex flex-col gap-1">
            <div class="flex items-center justify-between">
                <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_ADDRESS' | translate }}</label>
                <button
                    type="button"
                    (click)="showAddressAssistant.set(!showAddressAssistant())"
                    class="flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-md border border-orange-300 text-orange-500 bg-orange-50 hover:bg-orange-100 hover:border-orange-400 transition cursor-pointer">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                    {{ 'FORECAST.EDIT_DISTRIBUTOR.BTN_ADDRESS_ASSISTANT' | translate }}
                </button>
            </div>

            <!-- ASISTENTE DE CAPTURA -->
            @if (showAddressAssistant()) {
            <div class="border border-orange-200 rounded-lg bg-orange-50/40 p-3 flex flex-col gap-3">
                <p class="text-xs font-semibold text-orange-600 uppercase tracking-wide">{{ 'FORECAST.EDIT_DISTRIBUTOR.ADDRESS_ASSISTANT_TITLE' | translate }}</p>

                <div class="flex flex-col gap-2">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_STREET' | translate }}</label>
                        <input type="text"
                            [value]="addressParts().calle"
                            (input)="patchAddressPart('calle', $any($event.target).value)"
                            placeholder="Av. Insurgentes Sur"
                            class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_EXT' | translate }}</label>
                            <input type="text"
                                [value]="addressParts().noExterior"
                                (input)="patchAddressPart('noExterior', $any($event.target).value)"
                                placeholder="1234"
                                class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_INT' | translate }}</label>
                            <input type="text"
                                [value]="addressParts().noInterior"
                                (input)="patchAddressPart('noInterior', $any($event.target).value)"
                                placeholder="Piso 3"
                                class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_COLONY' | translate }}</label>
                            <input type="text"
                                [value]="addressParts().colonia"
                                (input)="patchAddressPart('colonia', $any($event.target).value)"
                                placeholder="Del Valle"
                                class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_LOCALITY' | translate }}</label>
                            <input type="text"
                                [value]="addressParts().localidad"
                                (input)="patchAddressPart('localidad', $any($event.target).value)"
                                placeholder="Benito Juárez"
                                class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_MUNICIPALITY' | translate }}</label>
                        <input type="text"
                            [value]="addressParts().municipio"
                            (input)="patchAddressPart('municipio', $any($event.target).value)"
                            placeholder="Benito Juárez"
                            class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_STATE' | translate }}</label>
                        <input type="text"
                            [value]="addressParts().estado"
                            (input)="patchAddressPart('estado', $any($event.target).value)"
                            placeholder="Ciudad de México"
                            class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_ZIP' | translate }}</label>
                            <input type="text"
                                [value]="addressParts().cp"
                                (input)="patchAddressPart('cp', $any($event.target).value)"
                                placeholder="03100"
                                class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_COUNTRY' | translate }}</label>
                            <input type="text"
                                [value]="addressParts().pais"
                                (input)="patchAddressPart('pais', $any($event.target).value)"
                                placeholder="México"
                                class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                        </div>
                    </div>

                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-gray-500">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_REFERENCE' | translate }}</label>
                        <input type="text"
                            [value]="addressParts().referencia"
                            (input)="patchAddressPart('referencia', $any($event.target).value)"
                            placeholder="Entre Calles..."
                            class="w-full text-sm px-3 py-1.5 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-orange-300 bg-white transition" />
                    </div>
                </div>

                <!-- PREVIEW -->
                @if (addressPreview()) {
                <div class="text-xs text-gray-500 bg-white border border-gray-200 rounded-md px-3 py-2 leading-relaxed">
                    <span class="font-semibold text-gray-400 uppercase text-[10px] tracking-wide block mb-0.5">{{ 'FORECAST.EDIT_DISTRIBUTOR.PREVIEW_LABEL' | translate }}</span>
                    {{ addressPreview() }}
                </div>
                }

                <div class="flex justify-end gap-2 pt-1">
                    <button type="button"
                        (click)="showAddressAssistant.set(false)"
                        class="text-sm px-3 py-1.5 rounded-md border border-gray-300 text-gray-600 hover:bg-gray-50 transition cursor-pointer">
                        {{ 'FORECAST.EDIT_DISTRIBUTOR.BTN_CANCEL_ASSISTANT' | translate }}
                    </button>
                    <button type="button"
                        (click)="applyAddressAssistant()"
                        [disabled]="!addressPreview()"
                        class="text-sm px-3 py-1.5 rounded-md bg-orange-500 text-white hover:bg-orange-600 transition cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
                        {{ 'FORECAST.EDIT_DISTRIBUTOR.BTN_APPLY_ADDRESS' | translate }}
                    </button>
                </div>
            </div>
            }

            <textarea
                rows="2"
                readonly
                [value]="form().address ?? ''"
                [placeholder]="'FORECAST.EDIT_DISTRIBUTOR.ADDRESS_PLACEHOLDER' | translate"
                class="w-full text-sm px-3 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-600 cursor-not-allowed resize-none select-none"></textarea>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_EMAILS' | translate }}</label>
            <input
                type="text"
                [value]="form().emails ?? ''"
                (input)="patchForm('emails', $any($event.target).value)"
                placeholder="contacto@ejemplo.com,ventas@ejemplo.com"
                class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition" />
            <span class="text-xs text-gray-400">{{ 'FORECAST.EDIT_DISTRIBUTOR.EMAILS_HINT' | translate }}</span>
        </div>

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.EDIT_DISTRIBUTOR.LABEL_CLIENT_NUMBER' | translate }}</label>
            <input
                type="text"
                [value]="form().clientNumber ?? ''"
                (input)="patchForm('clientNumber', $any($event.target).value)"
                placeholder="CL-001"
                class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition" />
        </div>

    </div>

</app-modal>
