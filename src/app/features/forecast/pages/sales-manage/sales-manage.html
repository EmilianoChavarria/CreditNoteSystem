<div class="min-h-screen bg-gray-50 p-6">

  <!-- Period + year selector -->
  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-2 text-sm text-gray-500">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      <span class="font-medium">Período activo:</span>
    </div>
    <div class="flex items-center gap-0.5 bg-white border border-gray-200 rounded-full px-1 py-1 shadow-sm">
      @for (year of years; track year) {
        <button
          type="button"
          (click)="selectYear(year)"
          [class]="activeYear() === year
            ? 'bg-[#ff8200] text-white px-5 py-1.5 rounded-full text-sm font-semibold transition'
            : 'text-gray-500 px-5 py-1.5 rounded-full text-sm hover:text-gray-800 transition'">
          {{ year }}
        </button>
      }
    </div>
  </div>

  <!-- Title + actions -->
  <div class="flex items-start justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Forecast de Ventas {{ activeYear() }}</h1>
      <p class="text-sm text-gray-400 mt-1">Consulta y solicita cambios en las proyecciones de tus clientes.</p>
    </div>
    <div class="mt-1">
      <input
        #fileInput
        type="file"
        accept=".csv,.xlsx"
        class="hidden"
        (change)="onFileSelected($event)">
      <button
        type="button"
        [disabled]="uploading()"
        (click)="fileInput.click()"
        class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed transition shadow-sm">
        @if (uploading()) {
          <svg class="animate-spin w-4 h-4 text-gray-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Importando...
        } @else {
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Importar Forecast
        }
      </button>
    </div>
  </div>

  <!-- Forecast table -->
  <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden mb-6">
    <app-forecast-table
      [distributors]="distributors()"
      [year]="activeYear()"
      [loading]="loading()"
      (refreshNeeded)="onRefreshNeeded()" />
  </div>

  <!-- Summary cards -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
      <p class="text-xs text-gray-400 mb-2">Total Forecast Anual</p>
      <p class="text-2xl font-bold text-gray-800">$ {{ grandTotal() | number:'1.0-0' }}</p>
    </div>
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-5">
      <p class="text-xs text-gray-400 mb-2">Clientes activos</p>
      <p class="text-2xl font-bold text-gray-800">{{ distributors().length }}</p>
    </div>
  </div>

  <!-- My requests -->
  <app-my-requests [refreshTrigger]="refreshTrigger()" />

  <!-- Pending approvals -->
  <div class="mt-6">
    <app-pending-approvals />
  </div>

</div>
