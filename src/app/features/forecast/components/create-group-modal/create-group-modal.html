<app-modal
    [open]="open()"
    [titleM]="'FORECAST.CREATE_GROUP_MODAL.TITLE' | translate"
    size="md"
    [primaryText]="'FORECAST.CREATE_GROUP_MODAL.CREATE' | translate"
    [closeText]="'FORECAST.CREATE_GROUP_MODAL.CANCEL' | translate"
    [primaryLoading]="saving()"
    [primaryDisabled]="saving() || !name().trim()"
    [closeOnBackdrop]="true"
    (openChange)="openChange.emit($event)"
    (primaryAction)="onSave()">

    <div class="flex flex-col gap-4">

        <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.CREATE_GROUP_MODAL.LABEL_NAME' | translate }}</label>
            <input
                type="text"
                [value]="name()"
                (input)="name.set($any($event.target).value)"
                placeholder="Baleromex"
                class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition" />
        </div>

        <!-- <div class="flex flex-col gap-1">
            <label class="text-xs font-semibold text-gray-500 uppercase tracking-wide">{{ 'FORECAST.CREATE_GROUP_MODAL.LABEL_DESCRIPTION' | translate }}</label>
            <textarea
                rows="3"
                [value]="description()"
                (input)="description.set($any($event.target).value)"
                placeholder="Distribuidores Baleromex México"
                class="w-full text-sm px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-400 transition resize-none"></textarea>
        </div> -->

        @if (error()) {
            <p class="text-xs text-red-500">{{ error() }}</p>
        }

        <p class="text-xs text-gray-400">{{ 'FORECAST.CREATE_GROUP_MODAL.HINT_NEXT_STEP' | translate }}</p>

    </div>

</app-modal>
