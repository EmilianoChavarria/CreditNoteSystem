<section class="flex flex-col w-full">
    <header class="w-full flex items-center justify-end">
        <div class="flex flex-col">
            <span class="text-2xl 2xl:text-4xl tracking-wider text-[#ff8200] font-semibold">{{'USER_MANAGE.TITLE' | translate}}</span>
            <span class="text-orange-400">{{'USER_MANAGE.DESCRIPTION' | translate}}</span>
        </div>
    </header>
    <app-tabla-dinamica [datos]="users()" [columnas]="columns" [accionesPersonalizadas]="acciones" actionMode="menu"
        [enableFilter]="true" filterField="role.roleName" [canAdd]="true" [canBulk]="true"
        [filterOptions]="roleFilterOptions()"
        [filterDefault]="selectedRoleName()"
        excelExportModule="users"
        [excelExportParams]="{ search: searchTerm(), roleName: selectedRoleName() }"
        excelExportFileName="users.xls"
        [addLabel]="'USERS_PAGE.USER'"
        [registrosPorPagina]="pageSize()" [serverPagination]="true" [paginaActualExterna]="currentPage()"
        [totalPaginasExterno]="totalPages()"
        [hasNextPage]="hasNextPage()" [hasPrevPage]="hasPrevPage()" [loading]="isLoadingTable()"
        (paginaSiguiente)="onNextPage()" (paginaAnterior)="onPrevPage()"
        (paginaPrimera)="onFirstPage()" (paginaUltima)="onLastPage()"
        (registrosPorPaginaChange)="onPageSizeChange($event)"
        (searchChange)="onSearch($event)"
        (filterChange)="onRoleFilterChange($event)"
        (addClick)="openUserModalForCreate()"
        (bulkClick)="openBulkUploadModal()" (refreshClick)="getUsers()">
        

        <ng-template #cellTemplate let-item let-column="column">
            @if (column.key === 'isActive') {
                <app-badge [color]="item.isActive ? 'green' : 'red'" [text]="item.isActive ? ('USERS_PAGE.ACTIVE' | translate) : ('USERS_PAGE.INACTIVE' | translate)" />
            }
        </ng-template>
    </app-tabla-dinamica>

    <app-reset-password-modal
        [open]="showResetPasswordModal()"
        [user]="selectedUserForReset()"
        (openChange)="onResetPasswordModalChange($event)">
    </app-reset-password-modal>

    <app-user-form-modal
        [open]="showUserModal()"
        [isEditMode]="isEditMode()"
        [isUserModalLoading]="isUserModalLoading()"
        [isSavingUser]="isSavingUser()"
        [showPassword]="showPassword()"
        [passwordErrors]="passwordErrors()"
        [userForm]="userForm"
        [roles]="roles()"
        [supervisors]="supervisors()"
        [isCustomerRoleSelected]="isCustomerRoleSelected()"
        [campoVacioFn]="campoVacio.bind(this)"
        [getErrorMessageFn]="getErrorMessage.bind(this)"
        [searchCustomersFn]="searchCustomers.bind(this)"
        [displayCustomerFn]="displayCustomer.bind(this)"
        (openChange)="onUserModalChange($event)"
        (save)="saveUserFromModal()"
        (togglePassword)="togglePassword()"
        (roleChange)="onRoleChange()"
        (customerSelected)="onCustomerSelected($event)">
    </app-user-form-modal>

    <app-bulk-users-upload-modal
        [open]="showBulkUploadModal()"
        (openChange)="onBulkUploadModalChange($event)">
    </app-bulk-users-upload-modal>

    <app-modal
        size="md"
        [titleM]="'USERS_PAGE.DELETE_USER' | translate"
        [open]="showDeleteModal()"
        [closeText]="'USERS_PAGE.CANCEL' | translate"
        [primaryText]="'USERS_PAGE.DELETE' | translate"
        (openChange)="onDeleteModalChange($event)"
        (primaryAction)="confirmDelete()">
        <p class="text-slate-700">
            {{ 'USERS_PAGE.CONFIRM_DELETE' | translate }}
            <span class="font-semibold">{{ selectedUserToDelete()?.fullName }}</span>?
        </p>
    </app-modal>
</section>
