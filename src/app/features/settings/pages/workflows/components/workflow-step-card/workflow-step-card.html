<div class="relative group">
  <div
    class="absolute -top-3 -left-3 z-20 h-7 w-7 rounded-lg bg-slate-800 text-white text-[11px] flex items-center justify-center font-bold shadow-lg transform group-hover:scale-110 transition-transform">
    {{ step().stepNumber }}
  </div>

  <div
    [class]="'relative w-44 min-h-[140px] rounded-xl border-2 p-4 transition-all duration-300 shadow-sm group-hover:shadow-md group-hover:-translate-y-1 ' + step().cardClass"
    [style.border-color]="step().cardBorderColor"
    [style.background-color]="step().badgeBgColor + '44'">

    <button type="button" (click)="editRequest.emit()"
      class="absolute top-2 right-2 p-1.5 rounded-full bg-white/80 opacity-0 group-hover:opacity-100 transition-opacity hover:text-[#ff8200] shadow-sm">
      <lucide-icon name="pencil" size="14"></lucide-icon>
    </button>

    <button type="button" (click)="deleteRequest.emit()" [disabled]="isDeleting()"
      class="absolute top-2 right-10 p-1.5 rounded-full bg-white/80 opacity-0 group-hover:opacity-100 transition-opacity hover:text-red-600 shadow-sm disabled:opacity-50 disabled:cursor-not-allowed">
      <lucide-icon name="trash" size="14"></lucide-icon>
    </button>

    <div class="flex flex-col items-center text-center gap-y-2 pt-2">
      <div class="h-10 w-10 rounded-full bg-white flex items-center justify-center shadow-sm border border-slate-100">
        <lucide-icon [name]="step().icon" size="20" [style.color]="step().iconColor || '#395f93'"></lucide-icon>
      </div>

      <div>
        <p class="font-bold text-xs text-slate-700 uppercase tracking-tight leading-tight">{{ step().roleName }}</p>
        <p class="text-[10px] text-slate-500 mt-1 italic">{{ step().description }}</p>
      </div>

      <span
        [class]="'mt-auto text-[10px] font-black px-3 py-1 rounded-full uppercase border ' + step().badgeClass"
        [style.color]="step().badgeColor"
        [style.background-color]="'white'"
        [style.border-color]="step().badgeColor">
        {{ step().action }}
      </span>
    </div>
  </div>
</div>
