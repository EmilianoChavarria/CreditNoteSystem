<section class="flex w-full flex-col px-2 py-3 sm:px-4 md:px-0 md:py-0">
    <header class="w-full flex flex-col items-start justify-end gap-1 sm:items-end sm:gap-0">
        <div class="flex flex-col">
            <span class="text-2xl 2xl:text-4xl tracking-wider text-[#ff8200] font-semibold">{{'CUSTOMER_VIEW.TITLE' |
                translate}}</span>
            <span class="text-sm sm:text-base text-orange-400">{{'CUSTOMER_VIEW.DESCRIPTION' | translate}}</span>
        </div>
    </header>
    <app-tabla-dinamica [datos]="customers()" [columnas]="columns" [accionesPersonalizadas]="acciones" actionMode="menu"
        [enableFilter]="true" filterField="area" addLabel="CUSTOMERS_PAGE.CUSTOMER" addRoute="/app/settings/newCustomer"
        [canAdd]="false" [registrosPorPagina]="pageSize()" [serverPagination]="true"
        [paginaActualExterna]="currentPage()" [totalPaginasExterno]="totalPages()" [hasNextPage]="hasNextPage()"
        [hasPrevPage]="hasPrevPage()" [loading]="isLoadingTable()" (paginaSiguiente)="onNextPage()"
        (paginaAnterior)="onPrevPage()" (paginaPrimera)="onFirstPage()" (paginaUltima)="onLastPage()"
        (registrosPorPaginaChange)="onPageSizeChange($event)" (searchChange)="onSearch($event)">

    </app-tabla-dinamica>

    <app-assign-modal [open]="isOpenModal()" (openChange)="showModal($event)"
        (primaryAction)="assignManagers($event)" />

    <app-customer-info-modal [open]="isOpenInfoModal()" [customer]="customer"
        (openChange)="isOpenInfoModal.set($event)" />
</section>
