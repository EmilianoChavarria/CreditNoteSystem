<app-modal
  size="sm"
  [titleM]="'MY_APPROVALS.APPROVE_MODAL_TITLE' | translate"
  [open]="open()"
  [closeText]="'MY_APPROVALS.CANCEL' | translate"
  [primaryText]="isLoading() ? ('MY_APPROVALS.APPROVING' | translate) : ('MY_APPROVALS.APPROVE' | translate)"
  [primaryLoading]="isLoading()"
  [primaryDisabled]="isLoading()"
  (openChange)="openChange.emit($event)"
  (primaryAction)="confirmed.emit(commentsControl.value ?? '')">

  <p class="text-sm text-gray-600">{{ 'MY_APPROVALS.APPROVE_MODAL_BODY' | translate : { requestNumber: request()?.requestNumber } }}</p>

  <div class="mt-3">
    <textarea
      [formControl]="commentsControl"
      [placeholder]="'MY_APPROVALS.ADD_COMMENTS' | translate"
      rows="3"
      class="mt-1 block w-full border border-gray-300 rounded-md p-2 shadow-sm focus:ring-blue-500 focus:border-blue-500 resize-none">
    </textarea>
  </div>

</app-modal>
