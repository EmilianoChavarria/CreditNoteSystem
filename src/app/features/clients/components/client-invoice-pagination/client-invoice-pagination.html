@if (total() > 0) {
<nav
    class="flex flex-col gap-3 rounded-lg border border-gray-200 bg-white px-4 py-3 shadow-sm sm:flex-row sm:items-center sm:justify-between"
    aria-label="Paginacion de facturas">
    <p class="text-sm text-gray-600">
        Mostrando {{ from() ?? 0 }} - {{ to() ?? 0 }} de {{ total() }} facturas
    </p>
    <div class="flex flex-wrap items-center gap-2">
        <button type="button"
            class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="page() <= 1 || isLoading()" (click)="pageChange.emit(1)" aria-label="Ir a la primera pagina"
            title="Primera pagina">
            <lucide-icon name="chevrons-left" size="16"></lucide-icon>
        </button>

        <button type="button"
            class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="page() <= 1 || isLoading()" (click)="pageChange.emit(page() - 1)"
            aria-label="Ir a la pagina anterior" title="Pagina anterior">
            <lucide-icon name="chevron-left" size="16"></lucide-icon>
        </button>

        @for (pageNumber of pageNumbers(); track pageNumber) {
        <button type="button" class="min-w-9 rounded-md border px-3 py-1.5 text-sm font-medium"
            [class.border-orange-500]="pageNumber === page()" [class.bg-orange-50]="pageNumber === page()"
            [class.text-orange-700]="pageNumber === page()" [class.border-gray-300]="pageNumber !== page()"
            [class.bg-white]="pageNumber !== page()" [class.text-gray-700]="pageNumber !== page()"
            [disabled]="isLoading()" (click)="pageChange.emit(pageNumber)">
            {{ pageNumber }}
        </button>
        }

        <button type="button"
            class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="page() >= lastPage() || isLoading()" (click)="pageChange.emit(page() + 1)"
            aria-label="Ir a la pagina siguiente" title="Pagina siguiente">
            <lucide-icon name="chevron-right" size="16"></lucide-icon>
        </button>

        <button type="button"
            class="inline-flex h-9 w-9 items-center justify-center rounded-md border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-50"
            [disabled]="page() >= lastPage() || isLoading()" (click)="pageChange.emit(lastPage())"
            aria-label="Ir a la ultima pagina" title="Ultima pagina">
            <lucide-icon name="chevrons-right" size="16"></lucide-icon>
        </button>
    </div>
</nav>
}
