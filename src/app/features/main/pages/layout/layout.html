<main class="flex flex-col min-h-screen h-screen w-full overflow-hidden bg-gray-50">

  <div class="flex flex-1 min-h-0 overflow-hidden">

    <app-sidebar class="h-full shrink-0 z-30"></app-sidebar>

    <div class="flex flex-col flex-1 min-w-0 transition-all duration-300 overflow-hidden">
      <app-navbar></app-navbar>

      <section class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-3 sm:p-4 md:p-6">

        <router-outlet></router-outlet>
      </section>
    </div>
  </div>

  <app-footer class="hidden 2xl:block"></app-footer>

  <div class="fixed bottom-3 right-3 z-50 rounded-md border border-red-300 bg-red-50/90 px-2 py-0.5 text-[11px] font-medium text-red-500 shadow-sm backdrop-blur-sm pointer-events-none select-none">
    Testing Environment
  </div>

  @if (isImpersonating()) {
  <aside class="fixed top-3 left-1/2 z-85 -translate-x-1/2 rounded-xl border border-amber-300 bg-amber-50/95 px-4 py-3 shadow-lg backdrop-blur-sm">
    <div class="flex flex-col gap-2 md:flex-row md:items-center md:gap-4">
      <div class="text-sm text-amber-900">
        <span class="font-semibold">Modo visualización activo:</span>
        @if (impersonatedUser(); as user) {
        <span class="ml-1">{{ user.fullName }} ({{ user.email }})</span>
        <span class="ml-1 text-amber-700">ID {{ user.id }}</span>
        } @else {
        <span class="ml-1">User ID {{ impersonatedUserId() }}</span>
        }
      </div>

      <button
        type="button"
        (click)="stopImpersonation()"
        class="rounded-lg bg-amber-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-amber-700">
        Salir de visualización
      </button>
    </div>
  </aside>
  }

</main>
