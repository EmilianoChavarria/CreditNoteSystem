<div class="w-full px-2 sm:px-4 md:px-0">

    <app-tabs-container #bulkTabs [showBottomButtons]="false" [initialTabIndex]="initialTabIndex()">
        <app-tab [titleT]="'BULK.TABS.UPLOAD' | translate">
            <div class="py-4">
                <div class="flex flex-col gap-1 w-full max-w-md">
                    <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.REQUEST_TYPE' | translate }} <span
                            class="text-red-500">*</span></span>
                    <select class="h-10 w-full border border-gray-300 rounded-md px-2"
                        [value]="selectedRequestTypeId() || ''" (change)="onRequestTypeChange($event)">
                        <option value="" disabled>{{ 'BULK.REQUEST_TYPE_PLACEHOLDER' | translate }}</option>
                        @for (type of availableRequestTypes(); track type.id) {
                        <option [value]="type.id">{{ type.name }}</option>
                        }
                    </select>
                </div>
            </div>
            <accordeon-container>
                @if (isReInvoicingSelected()) {
                <app-bulk-re-invoicing-upload [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()" (openInfo)="openInfoModal()"></app-bulk-re-invoicing-upload>
                } @else if (isMaterialReturnSelected()) {
                <app-bulk-material-return-upload [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()"
                    (openInfo)="openInfoModal()"></app-bulk-material-return-upload>
                } @else {
                <app-bulk-new-requests-upload [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()" (openInfo)="openInfoModal()"></app-bulk-new-requests-upload>
                }

                <app-bulk-upload-support-upload [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()"></app-bulk-upload-support-upload>

                @if (!isReInvoicingSelected()) {
                <app-bulk-order-numbers-upload [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()"></app-bulk-order-numbers-upload>
                }

                @if (!isReInvoicingSelected()) {
                <app-bulk-sap-return-order-upload [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()"></app-bulk-sap-return-order-upload>
                }

                <app-bulk-credits-data-upload [requestTypes]="availableRequestTypes()"
                    [selectedRequestTypeId]="selectedRequestTypeId()"
                    (batchCreated)="onUploadBatchCreated()"></app-bulk-credits-data-upload>



            </accordeon-container>
        </app-tab>
        <app-tab [titleT]="'BULK.TABS.HISTORY' | translate">
            <app-bulk-history-tab [isLoadingHistory]="isLoadingHistory()" [bulkHistoryRows]="bulkHistoryRows()"
                [historyFrom]="historyFrom()" [historyTo]="historyTo()" [historyTotal]="historyTotal()"
                [historyPageSize]="historyPageSize()" [historyCurrentPage]="historyCurrentPage()"
                [historyLastPage]="historyLastPage()" [historyHasPrevPage]="historyHasPrevPage()"
                [historyHasNextPage]="historyHasNextPage()" (openBatchDetail)="openBatchDetail($event)"
                (historyPageSizeChange)="onHistoryPageSizeChangeValue($event)" (historyFirstPage)="onHistoryFirstPage()"
                (historyPrevPage)="onHistoryPrevPage()" (historyNextPage)="onHistoryNextPage()"
                (historyLastPageClick)="onHistoryLastPage()"></app-bulk-history-tab>

            <app-batch-requests-modal [open]="isBatchDetailModalOpen()" [selectedBatchSummary]="selectedBatchSummary()"
                [selectedBatchErrors]="selectedBatchErrors()" [isLoadingBatchRequests]="isLoadingBatchRequests()"
                [batchRequestRows]="batchRequestRows()" [batchRequestsFrom]="batchRequestsFrom()"
                [batchRequestsTo]="batchRequestsTo()" [batchRequestsTotal]="batchRequestsTotal()"
                [batchRequestsPageSize]="batchRequestsPageSize()"
                [batchRequestsCurrentPage]="batchRequestsCurrentPage()"
                [batchRequestsLastPage]="batchRequestsLastPage()"
                [batchRequestsHasPrevPage]="batchRequestsHasPrevPage()"
                [batchRequestsHasNextPage]="batchRequestsHasNextPage()" (openChange)="closeBatchDetailModal($event)"
                (openRequestError)="openRequestErrorModal($event)"
                (batchRequestsPageSizeChange)="onBatchRequestsPageSizeChangeValue($event)"
                (batchRequestsFirstPage)="onBatchRequestsFirstPage()"
                (batchRequestsPrevPage)="onBatchRequestsPrevPage()" (batchRequestsNextPage)="onBatchRequestsNextPage()"
                (batchRequestsLastPageClick)="onBatchRequestsLastPage()"
                (refreshRequested)="onBatchDetailRefreshRequested()"></app-batch-requests-modal>

            <app-request-error-modal [open]="isRequestErrorModalOpen()" [selectedRequestError]="selectedRequestError()"
                (openChange)="closeRequestErrorModal($event)"></app-request-error-modal>
        </app-tab>
    </app-tabs-container>

</div>

<app-bulk-info-modal [open]="showInfoModal()" [selectedRequestTypeId]="selectedRequestTypeId()"
    (openChange)="showInfoModal.set($event)"></app-bulk-info-modal>
