<div class="p-2 md:p-8 flex flex-col">
    <header class="w-full flex items-start justify-end">
        <div class="flex flex-col">
            <span class="text-2xl 2xl:text-4xl tracking-wider text-[#ff8200] font-semibold">{{'DRAFTS.TITLE' |
                translate}}</span>
            <span class="text-orange-400">{{'DRAFTS.DESCRIPTION' | translate}}</span>
        </div>
    </header>

    @if (isLoadingTable()) {
    <app-spinner></app-spinner>
    } @else {
    <app-tabla-dinamica [columnas]="columns" [datos]="drafts()" [accionesPersonalizadas]="acciones()"
        [loading]="isLoadingTable()" [paginaActualExterna]="currentPage()" [registrosPorPagina]="pageSize()"
        [hasNextPage]="hasNextPage()" [hasPrevPage]="hasPrevPage()" (paginaSiguiente)="onNextPage()"
        (paginaAnterior)="onPrevPage()" (registrosPorPaginaChange)="onPageSizeChange($event)" [canAdd]="false">
    </app-tabla-dinamica>
    }

</div>
