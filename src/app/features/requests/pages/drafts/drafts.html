<div class="p-2 md:p-8 flex flex-col">
    <header class="w-full flex items-start justify-end">
        <div class="flex flex-col">
            <span class="text-2xl 2xl:text-4xl tracking-wider text-[#ff8200] font-semibold">{{'DRAFTS.TITLE' |
                translate}}</span>
            <span class="text-orange-400">{{'DRAFTS.DESCRIPTION' | translate}}</span>
        </div>
    </header>

    <app-tabla-dinamica [columnas]="columns" [datos]="drafts()" [accionesPersonalizadas]="acciones()"
        [showRefresh]="true" (refreshClick)="refreshDrafts()"
        [loading]="isLoadingTable()" [paginaActualExterna]="currentPage()" [registrosPorPagina]="pageSize()"
        [serverPagination]="true" [totalPaginasExterno]="totalPages()"
        [hasNextPage]="hasNextPage()" [hasPrevPage]="hasPrevPage()" (paginaSiguiente)="onNextPage()"
        (paginaAnterior)="onPrevPage()" (registrosPorPaginaChange)="onPageSizeChange($event)" [canAdd]="false">
    </app-tabla-dinamica>

    <app-modal size="md" [titleM]="'DRAFTS.DELETE_CONFIRM_TITLE' | translate" [open]="showDeleteModal()"
        [closeText]="'DRAFTS.CANCEL' | translate"
        [primaryText]="isDeletingDraft() ? ('DRAFTS.DELETING' | translate) : ('DRAFTS.DELETE_CONFIRM_BTN' | translate)"
        [primaryLoading]="isDeletingDraft()" [primaryDisabled]="isDeletingDraft()"
        (openChange)="onDeleteModalChange($event)" (primaryAction)="confirmDelete()">
        <p class="text-sm text-gray-700">{{'DRAFTS.DELETE_CONFIRM_MSG' | translate}}</p>
    </app-modal>
</div>
