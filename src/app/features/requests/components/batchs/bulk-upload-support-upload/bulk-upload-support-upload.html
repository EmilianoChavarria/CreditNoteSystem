<accordeon-item [titleM]="'BULK.SUPPORT.TITLE' | translate" [description]="'BULK.SUPPORT.DESCRIPTION' | translate"
    [openButtonText]="'BULK.OPEN' | translate" [closeButtonText]="'BULK.CLOSE' | translate">
    <div class="w-full flex flex-col p-3 sm:p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 items-stretch md:items-end">

            <div class="flex flex-col gap-1">
                <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.SUPPORT.MIN_RANGE' | translate }} <span class="text-red-500">*</span></span>
                <input
                    type="number"
                    min="1"
                    placeholder="10"
                    class="h-10 w-full border border-gray-300 rounded-md px-2"
                    [value]="minRange()"
                    (input)="onMinRangeChange($event)" />
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.SUPPORT.MAX_RANGE' | translate }} <span class="text-red-500">*</span></span>
                <input
                    type="number"
                    min="1"
                    placeholder="20"
                    class="h-10 w-full border border-gray-300 rounded-md px-2"
                    [value]="maxRange()"
                    (input)="onMaxRangeChange($event)" />
            </div>

            <button
                type="button"
                (click)="createBatch()"
                [disabled]="isCreatingBatch()"
                class="w-full bg-[#395f93] text-white rounded-md px-4 py-2 hover:cursor-pointer hover:bg-[#4d6ea5] disabled:opacity-70 disabled:cursor-not-allowed">
                {{ isCreatingBatch() ? ('BULK.COMMON.PROCESSING' | translate) : ('BULK.SUPPORT.PROCESS_BUTTON' | translate) }}
            </button>
        </div>

        <p class="text-xs text-gray-500 mt-3">{{ 'BULK.SUPPORT.HELP_TEXT' | translate }}</p>

        <app-bulk-file-dropzone
            [inputId]="'dropzone-file-support'"
            [dropHint]="'BULK.SUPPORT.DROP_HINT' | translate"
            [clickUploadText]="'BULK.COMMON.CLICK_UPLOAD' | translate"
            [isDragOver]="isDragOver()"
            [multiple]="true"
            (dragOver)="onDragOver($event)"
            (dragLeave)="onDragLeave($event)"
            (dropFile)="onDrop($event)"
            (fileChange)="onFileInputChange($event)">
        </app-bulk-file-dropzone>

        @if (uploadedFiles().length > 0) {
        <app-bulk-uploaded-files-table
            [rows]="uploadedFiles()"
            [caption]="'Listado de archivos de soporte cargados'"
            (remove)="removeUploadedFile($event)">
        </app-bulk-uploaded-files-table>
        }
    </div>
</accordeon-item>
