<accordeon-item [titleM]="titleTranslationKey | translate" [description]="'BULK.SAP.DESCRIPTION' | translate"
    [openButtonText]="'BULK.OPEN' | translate" [closeButtonText]="'BULK.CLOSE' | translate">
    <div class="w-full flex flex-col p-3 sm:p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 items-stretch md:items-end">
            <div class="hidden gap-1 w-full sm:min-w-44 sm:w-auto">
                <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.COMMON.BATCH_TYPE' | translate }}</span>
                <input
                    type="text"
                    value="sapScreen"
                    disabled
                    class="h-10 w-full border border-gray-200 rounded-md px-2 bg-gray-100 text-gray-600" />
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.COMMON.FORMAT' | translate }}</span>
                <input
                    type="text"
                    [value]="'BULK.SAP.FORMAT_VALUE' | translate"
                    disabled
                    class="h-10 w-full border border-gray-200 rounded-md px-2 bg-gray-100 text-gray-600" />
            </div>

            <button
                type="button"
                (click)="createBatch()"
                [disabled]="isCreatingBatch() || isPollingBatch()"
                class="h-10 w-full bg-[#395f93] text-white rounded-md px-4 py-2 hover:cursor-pointer hover:bg-[#4d6ea5] disabled:opacity-70 disabled:cursor-not-allowed">
                {{ isCreatingBatch() || isPollingBatch() ? ('BULK.COMMON.PROCESSING' | translate) : ('BULK.SAP.PROCESS_BUTTON' | translate) }}
            </button>
        </div>

        <p class="text-xs text-red-500 mt-3 font-bold">{{ 'BULK.SAP.HELP_TEXT' | translate }}</p>

        <app-bulk-file-dropzone
            [inputId]="'dropzone-file-sap-return-order'"
            [dropHint]="'BULK.SAP.DROP_HINT' | translate"
            [clickUploadText]="'BULK.COMMON.CLICK_UPLOAD' | translate"
            [isDragOver]="isDragOver()"
            [extraHint]="'BULK.SAP.NO_LIMIT_HINT' | translate"
            [multiple]="true"
            [accept]="'.jpg,.jpeg,.png,.gif,.webp,.bmp,.svg,.doc,.docx,.pdf,image/jpeg,image/png,image/gif,image/webp,image/bmp,image/svg+xml,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf'"
            (dragOver)="onDragOver($event)"
            (dragLeave)="onDragLeave($event)"
            (dropFile)="onDrop($event)"
            (fileChange)="onFileInputChange($event)">
        </app-bulk-file-dropzone>

        @if (uploadedFiles().length > 0) {
        <app-bulk-uploaded-files-table
            [rows]="uploadedFiles()"
            [caption]="'Listado de archivos cargados de retorno SAP'"
            (remove)="removeUploadedFile($event)">
        </app-bulk-uploaded-files-table>
        }
    </div>
</accordeon-item>
