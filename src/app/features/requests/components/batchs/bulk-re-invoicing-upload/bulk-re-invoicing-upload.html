<accordeon-item [titleM]="'BULK.NEW_REQUESTS.TITLE' | translate" [description]="'BULK.NEW_REQUESTS.DESCRIPTION' | translate"
    [openButtonText]="'BULK.OPEN' | translate" [closeButtonText]="'BULK.CLOSE' | translate">
    <div class="w-full flex flex-col p-3 sm:p-4">
        <div class="flex flex-col sm:flex-row sm:flex-wrap items-stretch sm:items-end justify-start gap-3 sm:gap-4">
            <button
                type="button"
                (click)="openInfo.emit()"
                class="w-full sm:w-auto sm:mr-auto flex items-center justify-center gap-2 border border-blue-300 bg-blue-50 text-blue-700 rounded-md px-3 py-2 hover:bg-blue-100 transition text-sm font-medium">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                {{ 'BULK.NEW_REQUESTS.VIEW_REASONS' | translate }}
            </button>

            <a href="/assets/templates/TemplateNewRequest - re-invoicing.csv" download="template-re-invoicing.csv"
                class="w-full sm:w-auto bg-[#ff8200] text-white rounded-md px-3 py-2 hover:cursor-pointer hover:bg-[#fc9629] flex flex-row items-center justify-center text-center gap-x-2">
                <lucide-icon name="download" size="16"></lucide-icon>
                {{ 'USERS_PAGE.BULK_DOWNLOAD_TEMPLATE' | translate }}
            </a>

            <button
                type="button"
                (click)="createBatch()"
                [disabled]="isCreatingBatch()"
                class="w-full sm:w-auto bg-[#395f93] text-white rounded-md px-4 py-2 hover:cursor-pointer hover:bg-[#4d6ea5] disabled:opacity-70 disabled:cursor-not-allowed">
                {{ isCreatingBatch() ? ('BULK.COMMON.PROCESSING' | translate) : ('BULK.NEW_REQUESTS.PROCESS_BUTTON' | translate) }}
            </button>
        </div>
        <app-bulk-file-dropzone
            [inputId]="'dropzone-file-re-invoicing'"
            [dropHint]="'BULK.NEW_REQUESTS.DROP_HINT' | translate"
            [clickUploadText]="'BULK.COMMON.CLICK_UPLOAD' | translate"
            [isDragOver]="isDragOver()"
            [accept]="'.csv'"
            (dragOver)="onDragOver($event)"
            (dragLeave)="onDragLeave($event)"
            (dropFile)="onDrop($event)"
            (fileChange)="onFileInputChange($event)">
        </app-bulk-file-dropzone>

        @if (uploadedFiles().length > 0) {
        <app-bulk-uploaded-files-table
            [rows]="uploadedFiles()"
            [caption]="'Listado de solicitudes cargadas'"
            (remove)="removeUploadedFile($event)">
        </app-bulk-uploaded-files-table>
        }
    </div>
</accordeon-item>
