<accordeon-item
    [titleM]="isAuditorDebitsSelected() ? ('BULK.CREDITS.TITLE_AUDITOR_DEBITS' | translate) : (isReInvoicingSelected() ? ('BULK.CREDITS.TITLE_REINVOICING' | translate) : (isDebitsSelected() ? ('BULK.CREDITS.TITLE_DEBITS' | translate) : ('BULK.CREDITS.TITLE_CREDITS' | translate)))"
    [description]="isReInvoicingSelected() ? ('BULK.CREDITS.DESCRIPTION_REINVOICING' | translate) : ('BULK.CREDITS.DESCRIPTION' | translate)" [openButtonText]="'BULK.OPEN' | translate"
    [closeButtonText]="'BULK.CLOSE' | translate">
    <div class="w-full flex flex-col p-3 sm:p-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 sm:gap-4 items-stretch md:items-end">
            <div class="hidden gap-1 w-full sm:min-w-44 sm:w-auto">
                <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.COMMON.BATCH_TYPE' | translate }}</span>
                <input type="text" value="creditsData" disabled
                    class="h-10 w-full border border-gray-200 rounded-md px-2 bg-gray-100 text-gray-600" />
            </div>

            <div class="flex flex-col gap-1">
                <span class="text-sm font-medium text-[#395f93]">{{ 'BULK.COMMON.FORMAT' | translate }}</span>
                <input type="text" [value]="'BULK.CREDITS.FORMAT_VALUE' | translate" disabled
                    class="h-10 w-full border border-gray-200 rounded-md px-2 bg-gray-100 text-gray-600" />
            </div>

            <a href="/assets/templates/template-credits-data.csv" download="template-credits-data.csv" class="w-full sm:w-auto bg-[#ff8200] text-white rounded-md px-3 py-2 hover:cursor-pointer hover:bg-[#fc9629] text-center flex flex-row items-center gap-x-2 justify-center">
                <lucide-icon name="download" size="16"></lucide-icon>
                {{ 'USERS_PAGE.BULK_DOWNLOAD_TEMPLATE' | translate }}</a>

            <button type="button" (click)="createBatch()" [disabled]="isCreatingBatch()"
                class="h-10 w-full bg-[#395f93] text-white rounded-md px-4 py-2 hover:cursor-pointer hover:bg-[#4d6ea5] disabled:opacity-70 disabled:cursor-not-allowed">
                {{ isCreatingBatch() ? ('BULK.COMMON.PROCESSING' | translate) : (isDebitsSelected() ?
                ('BULK.CREDITS.PROCESS_DEBITS' | translate) : (isReInvoicingSelected() ? ('BULK.CREDITS.PROCESS_REINVOICING' | translate) : ('BULK.CREDITS.PROCESS_CREDITS' | translate))) }}
            </button>
        </div>

        <!-- <p class="text-xs text-gray-500 mt-3">{{ isReInvoicingSelected() ? ('BULK.CREDITS.HELP_TEXT_REINVOICING' | translate) : ('BULK.CREDITS.HELP_TEXT' | translate) }}</p> -->

        <app-bulk-file-dropzone
            [inputId]="'dropzone-file-credits-data'"
            [dropHint]="isReInvoicingSelected() ? ('BULK.CREDITS.DROP_HINT_REINVOICING' | translate) : ('BULK.CREDITS.DROP_HINT' | translate)"
            [clickUploadText]="'BULK.COMMON.CLICK_UPLOAD' | translate"
            [isDragOver]="isDragOver()"
            [accept]="'.csv,.xlsx'"
            (dragOver)="onDragOver($event)"
            (dragLeave)="onDragLeave($event)"
            (dropFile)="onDrop($event)"
            (fileChange)="onFileInputChange($event)">
        </app-bulk-file-dropzone>

        @if (uploadedFiles().length > 0) {
        <app-bulk-uploaded-files-table
            [rows]="uploadedFiles()"
            [caption]="isReInvoicingSelected() ? 'Listado de archivos cargados para re-invoicing' : 'Listado de archivos cargados de creditos y debitos'"
            (remove)="removeUploadedFile($event)">
        </app-bulk-uploaded-files-table>
        }
    </div>
</accordeon-item>
